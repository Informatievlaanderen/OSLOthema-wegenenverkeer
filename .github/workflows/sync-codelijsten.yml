name: Sync codelijsten to dataset.json

on:
  push:
    branches:
      - master
    paths:
      - 'codelijsten/*.ttl'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v6

      - name: Sync codelists
        uses: ./.github/actions/sync-codelists
        with:
          source-repo: ${{ github.repository }}
          source-branch: ${{ github.ref_name }}
          source-dir: codelijsten
          target-repo: Informatievlaanderen/wegenenverkeer.data.vlaanderen.be
          target-branch: prod
          target-file: config/dataset.json
          ssh-key: ${{ secrets.SYNC_DEPLOY_KEY }}
          all-ttl-dir: codelijsten/all

      - name: Commit all.ttl and all.ttl.zip to source repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add codelijsten/all/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update all.ttl and all.ttl.zip"
            git push
          fi
